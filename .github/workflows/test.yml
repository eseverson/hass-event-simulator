name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The sandbox drives Home Assistant internals that core is free to change,
    # so a nightly run says when a new release has broken it.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest release hacs.json accepts.
          - ha: minimum
            python: "3.13"
            homeassistant: "2026.2.3"
          # The newest stable release, which is what most installs run. Each release can
          # raise the Python floor, and pip quietly falls back to an older core that still
          # fits, so this one follows core's own Python and pins the version it resolves.
          - ha: latest
            python: "3.14"
            homeassistant: latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install Home Assistant and the test harness
        run: |
          python -m pip install --upgrade pip
          VERSION="${{ matrix.homeassistant }}"
          if [ "$VERSION" = latest ]; then
            # The core the newest harness release pins, not PyPI's newest core: the harness
            # trails core releases by a day or so, and asking for a core no harness pins yet
            # makes pip backtrack to an ancient harness (pytest 6, which Python 3.14 breaks).
            VERSION=$(python -c "import json,re,urllib.request;info=json.load(urllib.request.urlopen('https://pypi.org/pypi/pytest-homeassistant-custom-component/json'))['info'];print(next(m.group(1) for r in info['requires_dist'] if (m:=re.fullmatch(r'homeassistant==(\S+)',r))))")
          fi
          echo "Home Assistant $VERSION"
          # The harness release that pins exactly this core.
          pip install "homeassistant==$VERSION" pytest-homeassistant-custom-component
          python -c "import homeassistant.const as c, sys; sys.exit(c.__version__ != '$VERSION')"
          # The frontend package is not a dependency of homeassistant, but the panel
          # tests need the exact build the installed core asks for.
          FRONTEND=$(python -c "import json,os,homeassistant.components.frontend as f;print(json.load(open(os.path.join(os.path.dirname(f.__file__),'manifest.json')))['requirements'][0])")
          pip install "$FRONTEND"
          # ZHA's own device-trigger code runs in the sandbox (zha device triggers), so its packages must be importable.
          pip install $(python scripts/integration_requirements.py zha)

      - name: Run the test suite
        env:
          EVENT_SIMULATOR_REQUIRE_ZHA: "1"
        run: pytest -q

  panel:
    name: panel (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 22 loads the panel's .js as an ES module without a package.json saying so.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check and test the panel module
        run: |
          node --check custom_components/event_simulator/panel/event-simulator-panel.js
          node --test tests/panel/*.test.mjs
